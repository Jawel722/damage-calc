
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damage Calculator</title>
<style>
:root {
    color-scheme: light dark;
    --bg: #f3f4f6;
    --panel: #ffffff;
    --text: #1d2129;
    --muted: #6b7280;
    --accent: #2f6fde;
    --border: #d8dbe0;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #14161b;
        --panel: #1d2027;
        --text: #e6e8eb;
        --muted: #9aa1ab;
        --accent: #6ea0ff;
        --border: #2e323b;
    }
}
body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.megacol {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}
.col {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
body > .megacol {
    gap: 16px;
    align-items: flex-start;
}
body > .megacol > .col {
    flex: 1 1 280px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
}
label {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
select, input[type="number"], input[type="search"] {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    max-width: 100%;
}
select:focus, input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
}
input[type="number"] {
    width: 70px;
}
input[type="checkbox"], input[type="radio"] {
    accent-color: var(--accent);
}
#fireMode {
    display: flex;
    gap: 14px;
}
#armor {
    display: flex;
    gap: 14px;
}
[hidden] {
    display: none !important;
}
details {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
}
details[open] {
    padding-bottom: 10px;
}
summary {
    cursor: pointer;
    color: var(--muted);
    font-weight: 600;
}
details[open] > summary {
    margin-bottom: 8px;
}
#abilityArmor {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
body > .megacol > .col:last-child label {
    gap: 4px;
    border-bottom: 1px solid var(--border);
    padding: 5px 0;
}
body > .megacol > .col:last-child span {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}
#realOut, #timeDead {
    color: var(--accent);
    font-size: 1.15em;
}
</style>
</head>
<body>
<div class = "megacol">
<div class = "col">
Поиск оружия: <input id='searchGun' type="search" list="gunList" placeholder="например, m41">
<datalist id="gunList"></datalist>
Тип Оружия: <select id = 'gunType'></select>
Оружие: <select id = 'gun'></select>
Магазин: <select id = 'magazine'></select>

<div class = "col">

<label id="labelBarrel">Дуло: <select id = 'barrel'></select></label>

</div>

<label id="labelStockActive">Разложен: <input type="checkbox" id = "stockActive"></label>

</div>
<div id = 'fireMode'></div>

<div class = "col">
<label>Навык стрельбы: <input type= "number" id = "firearmsSkill" value = "1" min = "0" max = "10"></label>

Поиск ксено: <input id='searchXeno' type="search" list="xenoList" placeholder="например, воин">

<div id="abilityArmor"></div>

<label>Хп до смерти: <span id= "hpDead"></span></label>

<label>Броня от способностей и баффов: <span id = "statArmorAbility"></span></label>
<label>Общая броня (с огнём): <span id = "statArmorGeneral"></span></label>
<label>Броня по направлению: <span id = "statArmorDir"></span></label>
<label>Итоговая броня: <span id = "statArmorTotal"></span></label>
<label>Броня после бронебойности: <span id = "statArmorEffective"></span></label>
<label>Уклонение: <span id = "statEvasion"></span></label>

</div>
</details>
</div>
<div class = "col">
<label>Урон: <span id = 'damageOut'></span></label>
<label>Шанс попадания: <span id = 'hitChance'></span>%</label>
<label>УвС: <span id = 'out'></span></label>
<label>Ожидаемый УвС: <span id = 'realOut'></span></label>
<label>Время до крита: <span id = "timeCrit"></span></label>
<label>Время до смерти: <span id = "timeDead"></span></label>

<script src = 'guns.js'></script>
<script src = 'magazines.js'></script>
<script src = 'projectiles.js'></script>

<script src = 'attachments.js'></script>
<script>
function findById(array,idFromSelect) {
    for (const item of array) {
        if (item.id === idFromSelect) {
            return item
        }
    }
return null
}
function applyFalloff(falloffStart,distance,falloff,damage,weaponMult, cutRange){
    const pastEffectiveRange = distance - falloffStart
    if (distance > cutRange){
        return 0;
    } else {
        if (pastEffectiveRange > 0) {
            const newDamage =  Math.max(damage - (pastEffectiveRange * falloff * weaponMult), damage *0.05);
            return newDamage;
        } else {
            return damage;
        }
    }
}

function applyArmor(damage,ap,armor){
    const effectiveArmor = Math.max(armor - ap, 0)
    const resist = 1.1**(effectiveArmor/5)
    let newDamage = damage/resist
    if (newDamage < effectiveArmor * 2) {
        const damageWithArmor = Math.max(0,newDamage * 4 - effectiveArmor)
        newDamage = damageWithArmor / 4
    } return newDamage;
}
function buckshotCheck(applyArmor,pellets) {
    const newDamage = applyArmor*pellets
    return newDamage
}

let lastAccuracyPoints = null
function accuracyCalc(projectile,gun,bothArmCheck,dist,evasion, rangeFlat, accuracyAddMult, focusAccMod) {
    if (projectile.accuracy === null) {
        return 1
    }
    let acc = projectile.accuracy
    if (bothArmCheck === true) {
        acc *= Math.max(gun.accuracyMult+accuracyAddMult, 0.1)
    } else {
        acc *= Math.max(gun.accuracyMultUnwielded+accuracyAddMult, 0.1)
    }
    acc += focusAccMod
    for (const threshold of projectile.accuracyThresholds) {
        const range = threshold.range + gun.accuracyRangeFlat + rangeFlat
        if (dist > range && threshold.buildup===false) {
            acc -= threshold.falloff * (dist - range)
        } else if (range > dist && threshold.buildup===true) {
            acc -= threshold.falloff * (range - dist)
        }
    }
    acc = Math.max(acc - evasion, projectile.minAccuracy)
    lastAccuracyPoints = acc
    const accChance = Math.min(acc/100, 1)
    return accChance
}
function dps(damage, fireRate){
    return damage * fireRate;
}

function scatterCalc (scatter,dist,radHitbox) {
    if (scatter === 0 || dist === 0) {
        return 1
    }
    const scatterRad = scatter * Math.PI/180
    const targetWidth = 2 * Math.atan(radHitbox / dist)
    const scatterChance = Math.min(targetWidth/scatterRad,1)
    return scatterChance
}

function attachmentsCalc (bothArmChecked,gun) {
    const selects = [selectBarrel,selectRail,selectUnderbarrel,selectStock]
    const actives = [barrelActive,railActive,underbarrelActive,stockActive]
    let damageAddMult = 0
    let accuracyAddMult = 0
    let rangeFlat = 0
    let damageFalloffAddMult = 0
    let scatterFlat = 0
    let burstScatterAddMult = 0
    let fireDelayFlat = 0
    let shotsPerBurstFlat = 0
    for (let i = 0; i < selects.length; i++) {
        if (selects[i].value==='' || selects[i].parentElement.hidden === true) {
            continue
        }
        let attachmentActive = false
        const attachment = findById(ATTACHMENTS,selects[i].value)
        if (actives[i].checked===true && attachment.toggleable === true) {
            attachmentActive = true
        }
        for (const mod of attachment.modifiers) {
            let attachmentWork = true
            if (mod.conditions.wieldedOnly === true && bothArmChecked === false) {
                attachmentWork = false
            } else if (mod.conditions.unwieldedOnly && bothArmChecked === true) {
                attachmentWork = false
            } else if (mod.conditions.activeOnly && attachmentActive === false) {
                attachmentWork = false
            } else if (mod.conditions.inactiveOnly && attachmentActive === true) {
                attachmentWork = false
            }
            if (mod.conditions.whitelistTags !== null) {
                let found = false
                for (const tag of mod.conditions.whitelistTags) {
                    if (gun.tags.includes(tag)) {
                        found = true
                    }
                }
                if (found === false) {
                   attachmentWork = false
                }
            }
            if (mod.conditions.blacklistTags !== null) {
                let found = false
                for (const tag of mod.conditions.blacklistTags) {
                    if (gun.tags.includes(tag)) {
                    found = true
                    }
                }
                if (found === true) {
                   attachmentWork = false
                }
            }
            if (attachmentWork === true) {
                damageAddMult += mod.damageAddMult
                accuracyAddMult += mod.accuracyAddMult
                rangeFlat += mod.rangeFlat
                damageFalloffAddMult += mod.damageFalloffAddMult
                scatterFlat += mod.scatterFlat
                burstScatterAddMult += mod.burstScatterAddMult
                fireDelayFlat += mod.fireDelayFlat
                shotsPerBurstFlat += mod.shotsPerBurstFlat
            }
        }
    }
    return {    damageAddMult: damageAddMult,
                accuracyAddMult: accuracyAddMult,
                rangeFlat: rangeFlat,
                damageFalloffAddMult: damageFalloffAddMult,
                scatterFlat: scatterFlat,
                burstScatterAddMult: burstScatterAddMult,
                fireDelayFlat: fireDelayFlat,
                shotsPerBurstFlat: shotsPerBurstFlat
            }
}

function recalc() {
    const dist = Math.max(Number(document.getElementById("dist").value), 0)
    const holotarget = (Math.min(Math.max(Number(document.getElementById("holotarget").value), 0),100))/1000
    const rest = document.getElementById("rest").checked
    const greenfire = document.getElementById("greenfire").checked
    const firearmsSkill = Math.min(Math.max(Number(document.getElementById("firearmsSkill").value),0),10)
    const focusLevel = Math.min(Math.max(Number(document.getElementById("focusLevel").value),0),3)
    const xenoHpCritHTML = document.getElementById("hpCrit")
    const xenoHpDeadHTML= document.getElementById("hpDead")
    const pheroShieldLevel = Math.min(Math.max(Number(document.getElementById("pheroShield").value),0),6)
    const fruitShield = document.getElementById("fruitShield").checked
    const valkyrieBuff = document.getElementById("valkyrieBuff").checked
    const gunId = gunSelect.value
    const magId = magazineSelect.value
    const xenoId = strainSelect.value
    const armorCheckFront = document.getElementById("armorCheckFront").checked
    const armorCheckSide = document.getElementById("armorCheckSide").checked
    const armorCheckBack = document.getElementById("armorCheckBack").checked
    const gun = findById(GUNS, gunId)
    bothArmCheck.disabled = gun.wieldable === false
    const bothArmChecked = bothArmCheck.checked && gun.wieldable !== false
    const magazine = findById(MAGAZINES, magId)
    const projectile = findById(PROJECTILES, magazine.projectile)
    const xeno = findById(XENOS, xenoId)
    const magBullets = magazine.capacity
    let xenoHpCrit = xeno.hpCrit
    let xenoHpDead = xeno.hpDead
    if (pheroShieldLevel !== 0) {
        xenoHpDead += 1 + pheroShieldLevel * 20
    }
    if (fruitShield === true) {
        xenoHpDead += Math.min(xeno.hpDead * 0.3,200)
        if (xenoHpCrit!==null)
            xenoHpCrit += Math.min(xeno.hpDead * 0.3,200)
    }
    xenoHpCritHTML.textContent = xenoHpCrit
    xenoHpDeadHTML.textContent = xenoHpDead
    const fireMode = fireModeSelect.querySelector("input:checked").value
    const mods = attachmentsCalc(bothArmChecked,gun)
    let scatterW = gun.scatterWielded
    let evasionAdd = 0
    if (rest === true) {
        evasionAdd = 15
    }
    let xenoGreenFire = 1
    if (greenfire === true) {
        xenoGreenFire = xeno.greenFireArmorMult
    }
    let firearmAccMod = 0
    let firearmScatterMod = 0
    let focusAccMod = 1.5 * focusLevel
    let focusAccPerTileMod = 0.35 * focusLevel * dist
    let focusAccModSum = focusAccMod + focusAccPerTileMod
    if (gun.unskilledPenalty!==null) {
        if (firearmsSkill<gun.unskilledPenalty.minSkill) {
        firearmAccMod = gun.unskilledPenalty.accuracyAddMult
        firearmScatterMod = gun.unskilledPenalty.scatterFlat
        }
    }
    if (firearmAccMod===0) {
        firearmAccMod = gun.skillAccuracyPerLevel * firearmsSkill
    }
    if (bothArmChecked === true) {
        scatterW = Math.max(gun.scatterWielded + mods.scatterFlat + firearmScatterMod,0)
    } else {
        scatterW = Math.max(gun.scatterUnwielded + mods.scatterFlat + firearmScatterMod,0)
    }
    let xenoAbilityArmor = 0
    let xenoAbilityFrontalArmor = 0
    let xenoAbilitySideArmor = 0
    let armorStack = 0
    let armorCheckTrue = document.getElementById("armor")
    for (const ability of xeno.armorAbilities) {
        const abilityInput = document.getElementById("ability-"+ability.id)
        if (abilityInput.checked===true) {
            xenoAbilityArmor += ability.xenoArmor
            xenoAbilityFrontalArmor += ability.frontalArmor
            xenoAbilitySideArmor += ability.sideArmor
        } else if (abilityInput.type === "number") {
            const currentStack = Math.max(Math.min(Number(abilityInput.value),ability.max),0)
            armorStack += Math.trunc(Math.floor(currentStack/ability.step)*ability.per)
        }

    }
    if (xeno.frontalArmor>0 || xeno.sideArmor>0 || xenoAbilityFrontalArmor>0 || xenoAbilitySideArmor > 0) { 
        armorCheckTrue.hidden = false
    } else if (xeno.frontalArmor===0 && xeno.sideArmor===0) {
        armorCheckTrue.hidden = true
    }
    let armorCheck = null
    if (armorCheckFront === true) {
        armorCheck = xeno.frontalArmor + xenoAbilityFrontalArmor
    } else if (armorCheckSide === true) {
        armorCheck = xeno.sideArmor +xenoAbilitySideArmor
    } else {
        armorCheck = 0
    }
    const fireModeMods = gun.fireModeMods[fireMode]
    let max = scatterW
    let step = 0
    if (fireModeMods !== undefined) {
        let maxUp = fireModeMods.maxScatterModifier
        if (fireModeMods.shotsToMaxScatter !== null) {
            if (fireModeMods.useBurstScatterMult===true) {
                maxUp = maxUp * (gun.burstScatterMult + mods.burstScatterAddMult)
            }
            if (bothArmChecked===false) {
                maxUp = maxUp * fireModeMods.unwieldedScatterMultiplier
            }
        max = Math.max(max + maxUp, scatterW)
        step = (max - scatterW)/fireModeMods.shotsToMaxScatter
        }
    }
    let gunFire = 1
    if (fireMode==="Burst") {
        gunFire = Math.max(gun.shotsPerBurst + mods.shotsPerBurstFlat,1)
    }
    if (fireMode==="FullAuto" && magazine.capacity!==null) {
        gunFire = magazine.capacity
    }
    let sumHitChance = 0 
    for (let k = 1; k <= gunFire; k++) {
        const boba = Math.min(scatterW + k * step, max)
        const biba = scatterCalc(boba,dist,xeno.hitboxRadius)
        sumHitChance += biba
    }
    
    const realHitChance = sumHitChance/gunFire
    let valkyrieArmor = 0
    if (valkyrieBuff === true) {
        valkyrieArmor = 15
    }
    const xenoGeneralArmor = Math.floor((xeno.xenoArmor+xenoAbilityArmor+ armorStack + valkyrieArmor)*xenoGreenFire)
    const realXenoArmor = xenoGeneralArmor + armorCheck
    const falloffStart = (projectile.falloffStart||0)+gun.rangeFlat+mods.rangeFlat
    const cutRange = (projectile.cutRange||999) + gun.rangeFlat + mods.rangeFlat
    const damageMult = gun.damageMult+mods.damageAddMult
    const falloffMult = Math.max(gun.falloffMult+mods.damageFalloffAddMult,0)
    const falloffStepResult = applyFalloff(falloffStart||0,dist,projectile.falloffPerTile||0,projectile.damage*damageMult,falloffMult,cutRange)
    const falloffResult = Math.max(falloffStepResult,projectile.damage*damageMult*0.05)
    const armorResult = applyArmor(falloffResult*(1+holotarget), projectile.ap,realXenoArmor)
    const damageResult = buckshotCheck(armorResult, projectile.pellets)
    const xenoEvasion = xeno.evasionModified-evasionAdd
    const acc = accuracyCalc(projectile, gun, bothArmChecked, dist, xenoEvasion, mods.rangeFlat,mods.accuracyAddMult+firearmAccMod, focusAccModSum)
    const hitChance = acc*realHitChance*100
    const realFireRate = fireRateCalc(fireMode,gun,mods.shotsPerBurstFlat,mods.fireDelayFlat)
    const dpsResult = dps(damageResult,realFireRate)
    const dpsRealResult = dpsResult*hitChance/100
    document.getElementById("out").textContent = dpsResult.toFixed(1)
    document.getElementById("damageOut").textContent = damageResult.toFixed(1)
    document.getElementById("realOut").textContent = dpsRealResult.toFixed(1)
    document.getElementById("hitChance").textContent = hitChance.toFixed(1)
    if (xenoHpCrit === null) {
        document.getElementById("timeCrit").textContent = "-"
    } else {
        document.getElementById("timeCrit").textContent = (xenoHpCrit/dpsRealResult).toFixed(1)+'с'
        if (xenoHpCrit/dpsRealResult===Infinity) {
            document.getElementById("timeCrit").textContent = "Никогда"
        }
    }
    document.getElementById("timeDead").textContent = (xenoHpDead/dpsRealResult).toFixed(1)+'с'
    if  (xenoHpDead/dpsRealResult===Infinity) {
        document.getElementById("timeDead").textContent = "Никогда"
    }
    document.getElementById("magDamage").textContent = projectile.damage * projectile.pellets
    document.getElementById("magAP").textContent = projectile.ap
    if (Math.ceil(xenoHpDead/damageResult)===Infinity) {
        document.getElementById("bulletsDead").textContent = "Бесконечно"
    } else {
        document.getElementById("bulletsDead").textContent = Math.ceil(xenoHpDead/damageResult)
    }
    if (magBullets === null) {
        document.getElementById("magBullets").textContent = gun.internalCapacity
    } else {
        document.getElementById("magBullets").textContent = magBullets
    }
    let accMultBase = gun.accuracyMultUnwielded
    if (bothArmChecked === true) {
        accMultBase = gun.accuracyMult
    }
    const accMult = Math.max(accMultBase + mods.accuracyAddMult + firearmAccMod, 0.1)
    const round2 = function (x) { return Math.round(x * 100) / 100 }
    document.getElementById("statDamageMult").textContent = "×" + round2(damageMult)
    if (projectile.falloffPerTile) {
        document.getElementById("statFalloff").textContent = "после " + round2(falloffStart) + " т. −" + round2(projectile.falloffPerTile * falloffMult) + " за тайл"
    } else {
        document.getElementById("statFalloff").textContent = "нет"
    }
    if (projectile.cutRange) {
        document.getElementById("statCut").textContent = round2(cutRange) + " т. (дальше 5%)"
    } else {
        document.getElementById("statCut").textContent = "нет"
    }
    document.getElementById("statDamageAtDist").textContent = round2(falloffResult * (1 + holotarget))
    if (projectile.accuracy === null) {
        document.getElementById("statAccBase").textContent = "не промахивается"
    } else {
        document.getElementById("statAccBase").textContent = projectile.accuracy
    }
    document.getElementById("statAccMult").textContent = "×" + round2(accMult)
    if (projectile.accuracy === null) {
        document.getElementById("statAcc").textContent = "100%"
    } else {
        document.getElementById("statAcc").textContent = round2(lastAccuracyPoints) + " очк. → шанс " + (acc * 100).toFixed(1) + "%"
    }
    if (step > 0) {
        document.getElementById("statCone").textContent = round2(scatterW) + "° → " + round2(max) + "° (+" + round2(step) + "° за выстрел)"
    } else {
        document.getElementById("statCone").textContent = round2(scatterW) + "°"
    }
    document.getElementById("statScatterChance").textContent = (realHitChance * 100).toFixed(1) + "%"
    document.getElementById("statSeries").textContent = gunFire + " выстр."
    document.getElementById("statFireRate").textContent = round2(realFireRate) + " выстр./с"
    document.getElementById("statArmorBase").textContent = xeno.xenoArmor
    document.getElementById("statArmorAbility").textContent = xenoAbilityArmor + armorStack + valkyrieArmor
    document.getElementById("statArmorGeneral").textContent = xenoGeneralArmor
    document.getElementById("statArmorDir").textContent = armorCheck
    document.getElementById("statArmorTotal").textContent = realXenoArmor
    document.getElementById("statArmorEffective").textContent = Math.max(realXenoArmor - projectile.ap, 0)
    document.getElementById("statEvasion").textContent = xenoEvasion
    document.getElementById("statHitbox").textContent = xeno.hitboxRadius
    let shotsPerMag = magBullets
    if (magBullets === null) {
        shotsPerMag = gun.internalCapacity
    }
    if (Math.ceil(Math.ceil(xenoHpDead/damageResult)/shotsPerMag)===Infinity) {
        document.getElementById("magazinesDead").textContent = "Бесконечно"
    } else {
        document.getElementById("magazinesDead").textContent = Math.ceil(Math.ceil(xenoHpDead/damageResult)/shotsPerMag)
    }
}

const magazineSelect = document.getElementById("magazine");
function selectGunMagazine() {
    const selectedGunId = gunSelect.value
    let foundGun = null;
    for (const gun of GUNS) {
            if (gun.id === selectedGunId) {
                foundGun = gun
            }
        }
    magazineSelect.innerHTML = ""
    for (const lethalPass of [true, false]) {
        for (const magazine of MAGAZINES) {
            if (!foundGun.magazines.includes(magazine.id)) {
                continue
            }
            const projectile = findById(PROJECTILES, magazine.projectile)
            const lethal = projectile !== null && projectile.damage > 0
            if (lethal !== lethalPass) {
                continue
            }
            const magazineOption = document.createElement("option");
            magazineOption.value = magazine.id;
            magazineOption.textContent = magazine.name;
            magazineSelect.appendChild(magazineOption);
        }
    }
}

let fireModeSelect = document.getElementById("fireMode")
function attachmentConditionsOk(cond, gun, bothArmChecked, attachmentActive) {
    if (cond.wieldedOnly === true && bothArmChecked === false) return false
    if (cond.unwieldedOnly === true && bothArmChecked === true) return false
    if (cond.activeOnly === true && attachmentActive === false) return false
    if (cond.inactiveOnly === true && attachmentActive === true) return false
    if (cond.whitelistTags !== null) {
        let found = false
        for (const tag of cond.whitelistTags) {
            if (gun.tags.includes(tag)) found = true
        }
        if (found === false) return false
    }
    if (cond.blacklistTags !== null) {
        for (const tag of cond.blacklistTags) {
            if (gun.tags.includes(tag)) return false
        }
    }
    return true
}

function availableFireModes(gun) {
    const modes = gun.fireModes.slice()
    let forced = null
    const selects = [selectBarrel, selectRail, selectUnderbarrel, selectStock]
    const actives = [barrelActive, railActive, underbarrelActive, stockActive]
    for (let i = 0; i < selects.length; i++) {
        if (selects[i].value === '' || selects[i].parentElement.hidden === true) {
            continue
        }
        const attachment = findById(ATTACHMENTS, selects[i].value)
        const attachmentActive = actives[i].checked === true && attachment.toggleable === true
        for (const fm of attachment.fireModeMods) {
            if (!attachmentConditionsOk(fm.conditions, gun, bothArmCheck.checked && gun.wieldable !== false, attachmentActive)) {
                continue
            }
            for (const mode of fm.extraFireModes) {
                if (!modes.includes(mode)) modes.push(mode)
            }
            if (fm.setFireMode) forced = fm.setFireMode
        }
    }
    return { modes: modes, forced: forced }
}

function selectFireMods () {
    const gun = findById(GUNS, gunSelect.value)
    const previous = fireModeSelect.querySelector("input:checked")
    const previousMode = previous ? previous.value : null
    const available = availableFireModes(gun)
    let chosen = available.modes[0]
    if (available.forced !== null && available.modes.includes(available.forced)) {
        chosen = available.forced
    } else if (previousMode !== null && available.modes.includes(previousMode)) {
        chosen = previousMode
    }
    fireModeSelect.innerHTML=""
    for (const fireMode of available.modes) {
        let baseLabel = document.createElement("label")
        let baseInput = document.createElement("input")
        baseInput.type = "radio"
        baseInput.name = "fireMode"
        baseInput.value= fireMode
        if (baseInput.value === "SemiAuto") {
            baseLabel.textContent = "Полуавто"
        } else if (baseInput.value === "FullAuto") {
            baseLabel.textContent = "Авто"
        } else if (baseInput.value === "Burst") {
            baseLabel.textContent = "Очередь"
        }
        if (baseInput.value === chosen)
            baseInput.checked = true
        baseLabel.appendChild(baseInput)
        fireModeSelect.appendChild(baseLabel)
    }
}

function selectAttachments(slot, idLabel,idSelect) {
    if (slot===undefined) {
        idLabel.hidden = true
    } else {
        idSelect.innerHTML=""
        idLabel.hidden = false
        let attachmentOption = null
        if (slot.locked !== true) {
            attachmentOption = document.createElement("option")
            attachmentOption.value = ''
            attachmentOption.textContent = "Нет"
            idSelect.appendChild(attachmentOption)
        }
        idSelect.disabled = slot.locked === true && slot.allowed.length <= 1
        for (const attachment of slot.allowed) {
            attachmentOption = document.createElement("option")
            attachmentOption.textContent = findById(ATTACHMENTS, attachment).name
            attachmentOption.value = attachment
            idSelect.appendChild(attachmentOption)
        }
        if (slot.starting!== null) {
            idSelect.value = slot.starting
        }
    }
}

function attachmentsToggleableCheck () {
    const actives = [labelBarrelActive,labelRailActive,labelUnderbarrelActive,labelStockActive]
    const selects = [selectBarrel,selectRail,selectUnderbarrel,selectStock]
    for (let i = 0; i < selects.length; i++) {
        actives[i].hidden = true
        if (selects[i].value !== "" && selects[i].parentElement.hidden === false) {
            const attachment = findById(ATTACHMENTS, selects[i].value)
            if (attachment.toggleable === true) {
                    actives[i].hidden = false
            }
        }
    }
}

function fireRateCalc (fireMode,gun,shotsPerBurstFlat,fireDelayFlat) {
    let fireRate = 0
    if (fireMode === 'SemiAuto') {
        fireRate = 1/(1/gun.fireRate+fireDelayFlat)
    } else if (fireMode === 'FullAuto') {
        let fireDelay = 0
        if (gun.fireModeMods.FullAuto === undefined) {
            fireDelay = 0
        } else {
            fireDelay = gun.fireModeMods.FullAuto.fireDelay
        }
        fireRate = 1/(1/gun.fireRate + fireDelay)
        fireRate = 1/(1/fireRate + fireDelayFlat)
    } else if (fireMode === 'Burst') {
        const shots = Math.max(gun.shotsPerBurst+shotsPerBurstFlat,1)
        let interval = 1/gun.gunBurstFireRate
        if (gun.fireModeMods.Burst !== undefined) {
            interval = 1/(gun.fireRate * gun.burstFireRateMult) + gun.fireModeMods.Burst.fireDelay
        }
        fireRate = shots/(shots*interval+gun.burstCooldown)
    }
    return fireRate
}

let abilitySelect = document.getElementById("abilityArmor")
function selectXenoAbility () {

        baseLabel.textContent = ability.name

        if (ability.kind === "toggle") {
            baseInput.type = "checkbox"
        } else if (ability.kind === "counter") {
            baseInput.type = "number"
            baseInput.min = 0
            baseInput.max = ability.max
            baseInput.step = ability.step
            baseInput.value = 0
        }
        baseInput.id = "ability-" + ability.id
        baseLabel.appendChild(baseInput)
        abilitySelect.appendChild(baseLabel)
    }
}

const searchGun = document.getElementById("searchGun")
const gunList = document.getElementById("gunList")
const searchXeno = document.getElementById("searchXeno")
const xenoList = document.getElementById("xenoList")

function xenoLabel(xeno) {
    if (xeno.strain === null) {
        return xeno.name
    }
    return xeno.name + " — " + xeno.strain
}

function fillSearchLists() {
    for (const gun of GUNS) {
        const option = document.createElement("option")
        option.value = gun.name
        gunList.appendChild(option)
    }
    for (const xeno of XENOS) {
        const option = document.createElement("option")
        option.value = xenoLabel(xeno)
        xenoList.appendChild(option)
    }
}

function findByText(array, text, getText) {
    for (const item of array) {
        if (getText(item).toLowerCase() === text) {
            return item
        }
    }
    for (const item of array) {
        if (getText(item).toLowerCase().includes(text)) {
            return item
        }
    }
    return null
}

function onGunSearch() {
    const text = searchGun.value.trim().toLowerCase()
    if (text === "") {
        return
    }
    const gun = findByText(GUNS, text, function (g) { return g.name })
    if (gun === null) {
        return
    }
    gunTypeSelect.value = gun.category
    selectGun()
    gunSelect.value = gun.id
    selectGunMagazine()
    selectFireMods()
    setAllAttachments()
    recalc()
    searchGun.value = gun.name
}

function onXenoSearch() {
    const text = searchXeno.value.trim().toLowerCase()
    if (text === "") {
        return
    }
    const xeno = findByText(XENOS, text, xenoLabel)
    if (xeno === null) {
        return
    }
    tierSelect.value = xeno.tier
    selectXeno()
    xenoSelect.value = xeno.name
    selectXenoStrain()
    strainSelect.value = xeno.id
    selectXenoAbility()
    recalc()
    searchXeno.value = xenoLabel(xeno)
}

function abilityExclusive(event) {
    const input = event.target
    if (input.type !== "checkbox" || input.checked !== true) {
        return
    }
    const xeno = findById(XENOS, strainSelect.value)
    for (const ability of xeno.armorAbilities) {
        if ("ability-" + ability.id === input.id && ability.exclusiveWith) {
            for (const otherId of ability.exclusiveWith) {
                const other = document.getElementById("ability-" + otherId)
                if (other !== null) {
                    other.checked = false
                }
            }
        }
    }
}
