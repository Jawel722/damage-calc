
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damage Calculator</title>
<style>
.megacol {
  display: flex;
  gap: 24px
}
.col {
    display: flex;
    flex-direction: column
}
</style>
</head>
<body>
<div class = "megacol">
<div class = "col">
Тип Оружия: <select id = 'gunType'></select>
Оружие: <select id = 'gun'></select>
Магазин: <select id = 'magazine'></select>
Дистанция: <input type="number" id="dist" value="0" min="0">
<label>С двух рук: <input type="checkbox" id="bothArmCheck" checked></label>
<div id = 'fireMode'></div>
<div class = "col">
<div class = "megacol">
<label id="labelBarrel">Дуло: <select id = 'barrel'></select></label>
<label id="labelBarrelActive">Активирован: <input type="checkbox" id = "barrelActive"></label>
</div>
<div class = "megacol">
<label id="labelRail">Прицел: <select id = 'rail'></select></label>
<label id="labelRailActive">Активирован: <input type="checkbox" id = "railActive"></label>
</div>
<div class = "megacol">
<label id="labelUnderbarrel">Подствольное: <select id = 'underbarrel'></select></label>
<label id="labelUnderbarrelActive">Активирован: <input type="checkbox" id = "underbarrelActive"></label>
</div>
<div class = "megacol">
<label id="labelStock">Приклад: <select id = 'stock'></select></label>
<label id="labelStockActive">Активирован: <input type="checkbox" id = "stockActive"></label>
</div>
</div>
</div>
<div class = "col">
Ксеноморф: <select id = 'xeno'></select>
Стрейн: <select id = 'strain'></select>
<div id="abilityArmor"></div>
<div hidden id="armor">
<label>Лоб:<input type='radio' id='armorCheckFront' name='armor' checked></label>
<label>Бок:<input type='radio' id='armorCheckSide' name='armor'></label>
<label>Спина:<input type='radio' id='armorCheckBack' name='armor'></label>
</div>
</div>
<div class = "col">
<label>Урон: <span id = 'damageOut'></span></label>
<label>Шанс попадания: <span id = 'hitChance'></span>%</label>
<label>УвС: <span id = 'out'></span></label>
<label>Ожидаемый УвС: <span id = 'realOut'></span></label>
</div>
</div>
<script src = 'guns.js'></script>
<script src = 'magazines.js'></script>
<script src = 'projectiles.js'></script>
<script src = 'xenos.js'></script>
<script src = 'attachments.js'></script>
<script>
function findById(array,idFromSelect) {
    for (const item of array) {
        if (item.id === idFromSelect) {
            return item
        }
    }
return null
}
function applyFalloff(falloffStart,distance,falloff,damage,weaponMult, cutRange){
    const pastEffectiveRange = distance - falloffStart
    if (distance > cutRange){
        return 0;
    } else {
        if (pastEffectiveRange > 0) {
            const newDamage =  Math.max(damage - (pastEffectiveRange * falloff * weaponMult), damage *0.05);
            return newDamage;
        } else {
            return damage;
        }
    }
}

function applyArmor(damage,ap,armor){
    const effectiveArmor = Math.max(armor - ap, 0)
    const resist = 1.1**(effectiveArmor/5)
    let newDamage = damage/resist
    if (newDamage < effectiveArmor * 2) {
        const damageWithArmor = Math.max(0,newDamage * 4 - effectiveArmor)
        newDamage = damageWithArmor / 4
    } return newDamage;
}
function buckshotCheck(applyArmor,pellets) {
    const newDamage = applyArmor*pellets
    return newDamage
}

function accuracyCalc(projectile,gun,bothArmCheck,dist,evasion, rangeFlat, accuracyAddMult) {
    if (projectile.accuracy === null) {
        return 1
    }
    let acc = projectile.accuracy
    if (bothArmCheck === true) {
        acc *= Math.max(gun.accuracyMult+accuracyAddMult, 0.1)
    } else {
        acc *= Math.max(gun.accuracyMultUnwielded+accuracyAddMult, 0.1)
    }
    for (const threshold of projectile.accuracyThresholds) {
        const range = threshold.range + gun.accuracyRangeFlat + rangeFlat
        if (dist > range && threshold.buildup===false) {
            acc -= threshold.falloff * (dist - range)
        } else if (range > dist && threshold.buildup===true) {
            acc -= threshold.falloff * (range - dist)
        }
    }
    acc = Math.max(acc - evasion, projectile.minAccuracy)
    const accChance = Math.min(acc/100, 1)
    return accChance
}
function dps(damage, fireRate){
    return damage * fireRate;
}

function scatterCalc (scatter,dist,radHitbox) {
    if (scatter === 0 || dist === 0) {
        return 1
    }
    const scatterRad = scatter * Math.PI/180
    const targetWidth = 2 * Math.atan(radHitbox / dist)
    const scatterChance = Math.min(targetWidth/scatterRad,1)
    return scatterChance
}

function attachmentsCalc (bothArmChecked) {
    const selects = [selectBarrel,selectRail,selectUnderbarrel,selectStock]
    const actives = [barrelActive,railActive,underbarrelActive,stockActive]
    let damageAddMult = 0
    let accuracyAddMult = 0
    let rangeFlat = 0
    let damageFalloffAddMult = 0
    let scatterFlat = 0
    let burstScatterAddMult = 0
    let fireDelayFlat = 0
    let shotsPerBurstFlat = 0
    for (let i = 0; i < selects.length; i++) {
        if (selects[i].value==='' || selects[i].parentElement.hidden === true) {
            continue
        }
        let attachmentActive = false
        const attachment = findById(ATTACHMENTS,selects[i].value)
        if (actives[i].checked===true && attachment.toggleable === true) {
            attachmentActive = true
        }
        for (const mod of attachment.modifiers) {
            let attachmentWork = true
            if (mod.conditions.wieldedOnly === true && bothArmChecked === false) {
                attachmentWork = false
            } else if (mod.conditions.unwieldedOnly && bothArmChecked === true) {
                attachmentWork = false
            } else if (mod.conditions.activeOnly && attachmentActive === false) {
                attachmentWork = false
            } else if (mod.conditions.inactiveOnly && attachmentActive === true) {
                attachmentWork = false
            }
            if (attachmentWork === true) {
                damageAddMult += mod.damageAddMult
                accuracyAddMult += mod.accuracyAddMult
                rangeFlat += mod.rangeFlat
                damageFalloffAddMult += mod.damageFalloffAddMult
                scatterFlat += mod.scatterFlat
                burstScatterAddMult += mod.burstScatterAddMult
                fireDelayFlat += mod.fireDelayFlat
                shotsPerBurstFlat += mod.shotsPerBurstFlat
            }
        }
    }
    return {    damageAddMult: damageAddMult,
                accuracyAddMult: accuracyAddMult,
                rangeFlat: rangeFlat,
                damageFalloffAddMult: damageFalloffAddMult,
                scatterFlat: scatterFlat,
                burstScatterAddMult: burstScatterAddMult,
                fireDelayFlat: fireDelayFlat,
                shotsPerBurstFlat: shotsPerBurstFlat
            }
}

function recalc() {
    const dist = Math.max(Number(document.getElementById("dist").value), 0)
    const gunId = gunSelect.value
    const magId = magazineSelect.value
    const xenoId = strainSelect.value
    const armorCheckFront = document.getElementById("armorCheckFront").checked
    const armorCheckSide = document.getElementById("armorCheckSide").checked
    const armorCheckBack = document.getElementById("armorCheckBack").checked
    const bothArmChecked = bothArmCheck.checked
    const gun = findById(GUNS, gunId)
    const magazine = findById(MAGAZINES, magId)
    const projectile = findById(PROJECTILES, magazine.projectile)
    const xeno = findById(XENOS, xenoId)
    const fireMode = fireModeSelect.querySelector("input:checked").value
    const mods = attachmentsCalc(bothArmChecked)
    let scatterW = gun.scatterWielded
    if (bothArmChecked === true) {
        scatterW = Math.max(gun.scatterWielded + mods.scatterFlat,0)
    } else {
        scatterW = Math.max(gun.scatterUnwielded + mods.scatterFlat,0)
    }
    let xenoAbilityArmor = 0
    let xenoAbilityFrontalArmor = 0
    let xenoAbilitySideArmor = 0
    let armorStack = 0
    let armorCheckTrue = document.getElementById("armor")
    for (const ability of xeno.armorAbilities) {
        const abilityInput = document.getElementById("ability-"+ability.id)
        if (abilityInput.checked===true) {
            xenoAbilityArmor += ability.xenoArmor
            xenoAbilityFrontalArmor += ability.frontalArmor
            xenoAbilitySideArmor += ability.sideArmor
        } else if (abilityInput.type === "number") {
            const currentStack = Math.max(Math.min(Number(abilityInput.value),ability.max),0)
            armorStack += Math.trunc(Math.floor(currentStack/ability.step)*ability.per)
        }

    }
    if (xeno.frontalArmor>0 || xeno.sideArmor>0 || xenoAbilityFrontalArmor>0 || xenoAbilitySideArmor > 0) { 
        armorCheckTrue.hidden = false
    } else if (xeno.frontalArmor===0 && xeno.sideArmor===0) {
        armorCheckTrue.hidden = true
    }
    let armorCheck = null
    if (armorCheckFront === true) {
        armorCheck = xeno.frontalArmor + xenoAbilityFrontalArmor
    } else if (armorCheckSide === true) {
        armorCheck = xeno.sideArmor +xenoAbilitySideArmor
    } else {
        armorCheck = 0
    }
    const fireModeMods = gun.fireModeMods[fireMode]
    let max = scatterW
    let step = 0
    if (fireModeMods !== undefined) {
        let maxUp = fireModeMods.maxScatterModifier
        if (fireModeMods.shotsToMaxScatter !== null) {
            if (fireModeMods.useBurstScatterMult===true) {
                maxUp = maxUp * (gun.burstScatterMult + mods.burstScatterAddMult)
            }
            if (bothArmChecked===false) {
                maxUp = maxUp * fireModeMods.unwieldedScatterMultiplier
            }
        max = Math.max(max + maxUp, scatterW)
        step = (max - scatterW)/fireModeMods.shotsToMaxScatter
        }
    }
    let gunFire = 1
    if (fireMode==="Burst") {
        gunFire = Math.max(gun.shotsPerBurst + mods.shotsPerBurstFlat,1)
    }
    if (fireMode==="FullAuto" && magazine.capacity!==null) {
        gunFire = magazine.capacity
    }
    let sumHitChance = 0 
    for (let k = 1; k <= gunFire; k++) {
        const boba = Math.min(scatterW + k * step, max)
        const biba = scatterCalc(boba,dist,xeno.hitboxRadius)
        sumHitChance += biba
    }
    
    const realHitChance = sumHitChance/gunFire
    const realXenoArmor = xeno.xenoArmor + armorCheck + xenoAbilityArmor + armorStack
    const falloffResult = applyFalloff(((projectile.falloffStart||0)+gun.rangeFlat+mods.rangeFlat)||0,dist,projectile.falloffPerTile||0,projectile.damage*(gun.damageMult+mods.damageAddMult),Math.max(gun.falloffMult+mods.damageFalloffAddMult,0),(projectile.cutRange||999) + gun.rangeFlat + mods.rangeFlat)
    const armorResult = applyArmor(falloffResult, projectile.ap,realXenoArmor)
    const damageResult = buckshotCheck(armorResult, projectile.pellets)
    const acc = accuracyCalc(projectile, gun, bothArmChecked, dist, xeno.evasionModified, mods.rangeFlat,mods.accuracyAddMult)
    const hitChance = acc*realHitChance*100
    const realFireRate = fireRateCalc(fireMode,gun,mods.shotsPerBurstFlat,mods.fireDelayFlat)
    const dpsResult = dps(damageResult,realFireRate)
    const dpsRealResult = dpsResult*hitChance/100
    document.getElementById("out").textContent = dpsResult.toFixed(1)
    document.getElementById("damageOut").textContent = damageResult.toFixed(1)
    document.getElementById("realOut").textContent = dpsRealResult.toFixed(1)
    document.getElementById("hitChance").textContent = hitChance.toFixed(1)
}

const gunTypeSelect = document.getElementById("gunType");
const types = []
function selectGunType(){
    for (const gunType of GUNS) {
        const gunTypeOption = document.createElement("option");
        gunTypeOption.value = gunType.category;
        gunTypeOption.textContent = gunType.category;
        if (!types.includes(gunType.category)) {
            types.push(gunType.category)
            gunTypeSelect.appendChild(gunTypeOption)
        }
    }
}
const gunSelect = document.getElementById("gun");
function selectGun() {
    gunSelect.innerHTML = ""
    const selectedGunType = gunTypeSelect.value
    for (const gun of GUNS) {
        const gunOption = document.createElement("option");
        gunOption.value = gun.id;
        gunOption.textContent = gun.name;
            if (gun.category === selectedGunType) {
        gunSelect.appendChild(gunOption);
        }
    }
}
const magazineSelect = document.getElementById("magazine");
function selectGunMagazine() {
    const selectedGunId = gunSelect.value
    let foundGun = null;
    for (const gun of GUNS) {
            if (gun.id === selectedGunId) {
                foundGun = gun
            }
        }
    magazineSelect.innerHTML = ""
    for (const magazine of MAGAZINES) {
        const magazineOption = document.createElement("option");
        magazineOption.value = magazine.id;
        magazineOption.textContent = magazine.name;
        if (foundGun.magazines.includes(magazine.id)) {
            magazineSelect.appendChild(magazineOption);
        }
    }
}

let fireModeSelect = document.getElementById("fireMode")
function selectFireMods () {
    const gun = findById(GUNS, gunSelect.value)
    fireModeSelect.innerHTML=""
    for (const fireMode of gun.fireModes) {
        let baseLabel = document.createElement("label")
        let baseInput = document.createElement("input")
        baseInput.type = "radio"
        baseInput.name = "fireMode"
        baseInput.value= fireMode
        if (baseInput.value === "SemiAuto") {
            baseLabel.textContent = "Полуавто"
        } else if (baseInput.value === "FullAuto") {
            baseLabel.textContent = "Авто"
        } else if (baseInput.value === "Burst") {
            baseLabel.textContent = "Очередь"
        }
        if (baseInput.value === gun.fireModes[0])
            baseInput.checked = true
        baseLabel.appendChild(baseInput)
        fireModeSelect.appendChild(baseLabel)
    }
}

function selectAttachments(slot, idLabel,idSelect) {
    if (slot===undefined) {
        idLabel.hidden = true
    } else {
        idSelect.innerHTML=""
        idLabel.hidden = false
        let attachmentOption = document.createElement("option")
        attachmentOption.value = ''
        attachmentOption.textContent = "Нет"
        idSelect.appendChild(attachmentOption)
        for (const attachment of slot.allowed) {
            attachmentOption = document.createElement("option")
            attachmentOption.textContent = findById(ATTACHMENTS, attachment).name
            attachmentOption.value = attachment
            idSelect.appendChild(attachmentOption)
        }
        if (slot.starting!== null) {
            idSelect.value = slot.starting
        }
    }
}

const labelBarrel = document.getElementById("labelBarrel")
const labelRail = document.getElementById("labelRail")
const labelUnderbarrel = document.getElementById("labelUnderbarrel")
const labelStock = document.getElementById("labelStock")
const selectBarrel = document.getElementById("barrel")
const selectRail = document.getElementById("rail")
const selectUnderbarrel = document.getElementById("underbarrel")
const selectStock = document.getElementById("stock")
const labelBarrelActive = document.getElementById("labelBarrelActive")
const labelRailActive = document.getElementById("labelRailActive")
const labelUnderbarrelActive = document.getElementById("labelUnderbarrelActive")
const labelStockActive = document.getElementById("labelStockActive")

function attachmentsToggleableCheck () {
    const actives = [labelBarrelActive,labelRailActive,labelUnderbarrelActive,labelStockActive]
    const selects = [selectBarrel,selectRail,selectUnderbarrel,selectStock]
    for (let i = 0; i < selects.length; i++) {
        actives[i].hidden = true
        if (selects[i].value !== "" && selects[i].parentElement.hidden === false) {
            const attachment = findById(ATTACHMENTS, selects[i].value)
            if (attachment.toggleable === true) {
                    actives[i].hidden = false
            }
        }
    }
}

function fireRateCalc (fireMode,gun,shotsPerBurstFlat,fireDelayFlat) {
    let fireRate = 0
    if (fireMode === 'SemiAuto') {
        fireRate = 1/(1/gun.fireRate+fireDelayFlat)
    } else if (fireMode === 'FullAuto') {
        let fireDelay = 0
        if (gun.fireModeMods.FullAuto === undefined) {
            fireDelay = 0
        } else {
            fireDelay = gun.fireModeMods.FullAuto.fireDelay
        }
        fireRate = 1/(1/gun.fireRate + fireDelay)
        fireRate = 1/(1/fireRate + fireDelayFlat)
    } else if (fireMode === 'Burst') {
        fireRate = (Math.max(gun.shotsPerBurst+shotsPerBurstFlat,1))/((Math.max(gun.shotsPerBurst+shotsPerBurstFlat,1))*(1/(gun.fireRate * gun.burstFireRateMult) + gun.fireModeMods.Burst.fireDelay)+gun.burstCooldown)
    }
    return fireRate
}

const xenoSelect = document.getElementById("xeno");
for (const xeno of XENOS) {
    const xenoOption = document.createElement("option");
    xenoOption.value = xeno.name;
    xenoOption.textContent = xeno.name;
    if (xeno.strain === null) { 
        xenoSelect.appendChild(xenoOption);
    }
}

const strainSelect = document.getElementById("strain");
function selectXenoStrain () {
    const selectedXeno = xenoSelect.value
    strainSelect.innerHTML = ""
    for (const strain of XENOS) {
        const strainOption = document.createElement("option");
        strainOption.value = strain.id
        if (strain.strain) {
            strainOption.textContent = strain.strain
        } else {
            strainOption.textContent = "База"
        }
        if (strain.name===selectedXeno) { 
            strainSelect.appendChild(strainOption)
        }
    }
}

let abilitySelect = document.getElementById("abilityArmor")
function selectXenoAbility () {
    const xeno = findById(XENOS, strainSelect.value)
    abilitySelect.innerHTML = ""
    for (const ability of xeno.armorAbilities) {
        let baseLabel = document.createElement("label")
        baseLabel.textContent = ability.name
        let baseInput = document.createElement("input")
        if (ability.kind === "toggle") {
            baseInput.type = "checkbox"
        } else if (ability.kind === "counter") {
            baseInput.type = "number"
            baseInput.min = 0
            baseInput.max = ability.max
            baseInput.step = ability.step
            baseInput.value = 0
        }
        baseInput.id = "ability-" + ability.id
        baseLabel.appendChild(baseInput)
        abilitySelect.appendChild(baseLabel)
    }
}

selectGunType();
selectGun();
selectGunMagazine();
selectFireMods();
selectXenoStrain();
selectXenoAbility();
function setAllAttachments(){
    const gunSlots = findById(GUNS, gunSelect.value).attachmentSlots
    selectAttachments(gunSlots.barrel,labelBarrel,selectBarrel)
    selectAttachments(gunSlots.rail,labelRail,selectRail)
    selectAttachments(gunSlots.underbarrel,labelUnderbarrel,selectUnderbarrel)
    selectAttachments(gunSlots.stock,labelStock,selectStock)
    attachmentsToggleableCheck ()
}
setAllAttachments();
xenoSelect.addEventListener("change", selectXenoStrain);
xenoSelect.addEventListener("change", selectXenoAbility);
strainSelect.addEventListener("change", selectXenoAbility);
gunSelect.addEventListener("change", selectGunMagazine);
gunSelect.addEventListener("change", selectFireMods);
gunSelect.addEventListener("change", setAllAttachments);
gunTypeSelect.addEventListener("change", selectGun);
gunTypeSelect.addEventListener("change", selectGunMagazine);
gunTypeSelect.addEventListener("change", selectFireMods);
gunTypeSelect.addEventListener("change", setAllAttachments);
fireModeSelect.addEventListener("change",recalc)
bothArmCheck.addEventListener("input",recalc)
abilitySelect.addEventListener("input",recalc)
abilitySelect.addEventListener("change",recalc)
gunSelect.addEventListener("change", recalc)
magazineSelect.addEventListener("change", recalc)
xenoSelect.addEventListener("change",recalc)
strainSelect.addEventListener("change", recalc)
gunTypeSelect.addEventListener("change", recalc)
armorCheckFront.addEventListener("change", recalc)
armorCheckSide.addEventListener("change", recalc)
armorCheckBack.addEventListener("change", recalc)
dist.addEventListener("input",recalc)
barrel.addEventListener("change",recalc)
underbarrel.addEventListener("change",recalc)
rail.addEventListener("change",recalc)
stock.addEventListener("change",recalc)
barrel.addEventListener("change",attachmentsToggleableCheck)
underbarrel.addEventListener("change",attachmentsToggleableCheck)
rail.addEventListener("change",attachmentsToggleableCheck)
stock.addEventListener("change",attachmentsToggleableCheck)
barrelActive.addEventListener("input",recalc)
underbarrelActive.addEventListener("input",recalc)
railActive.addEventListener("input",recalc)
stockActive.addEventListener("input",recalc)
recalc()
</script>
</body>
</html>
